<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heading Detector</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100%;
      min-width: 300px;
    }

    .heading-list {
      max-height: calc(100vh - 200px);
    }
  </style>
</head>

<body>
  <div class="container" id="container">
    <div class="controls-container">
      <div class="hover-trigger">
        <header class="header" id="header">
          <div class="header-top">
            <span class="result-count"><span id="resultCount">0</span> 件の見出しを検出</span>
            <span class="stats-compact" id="statsCompact"></span>
            <button class="header-hint" title="メニューを表示">⚙️</button>
          </div>
        </header>

        <div class="legend">
          <span class="badge native">✨ ネイティブ</span>
          <span class="badge detected">✨ 検出</span>
          <span class="badge query">💬 クエリ</span>
          <span class="badge response">💭 回答</span>
        </div>
      </div>

      <div class="tools-overlay">
        <div class="auto-refresh-row">
          <button id="manualRefresh" class="btn-refresh" title="手動更新">🔃</button>
          <button id="autoToggle" class="btn btn-action active" title="DOM変更の自動追従">Auto</button>
          <div class="delay-controls">
            <button id="delayDown" class="btn-delay" title="遅延時間を減らす">−</button>
            <span id="delayValue" class="delay-value">1.5s</span>
            <button id="delayUp" class="btn-delay" title="遅延時間を増やす">+</button>
          </div>
          <span id="autoStatus" class="auto-status">Ready</span>
        </div>

        <div class="button-row">
          <div id="expandBtns" class="expand-btns"></div>
          <label class="checkbox-label" title="H1-H6バッジを表示">
            <input type="checkbox" id="hBadgeToggle">
            <span>Hバッジ</span>
          </label>
          <button id="wrapBtn" class="btn btn-action">Wrap</button>
          <label class="checkbox-label" title="本文の見出しをハイライト">
            <input type="checkbox" id="highlightToggle">
            <span>ハイライト</span>
          </label>
          <button id="modeToggle" class="btn btn-action">Popup</button>
          <button id="settingsBtn" class="btn btn-action" title="色設定">⚙️</button>
        </div>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="🔎 見出しを検索...">
      <button id="searchClear" class="btn btn-small">✕</button>
    </div>

    <div id="headingList" class="heading-list"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="settings-core.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
